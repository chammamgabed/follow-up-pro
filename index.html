<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Registration</title>
<style>
*{box-sizing:border-box}
:root{--navy:#14213d;--blue:#2563eb;--green:#138a4b;--bg:#f4f7fb;--text:#172033;--muted:#667085;--line:#e4e7ec}
body{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#14213d,#1f3159);color:#fff;padding:28px 20px;text-align:center;box-shadow:0 5px 18px #14213d22}
header h1{margin:0;font-size:28px;letter-spacing:.2px}
main{max-width:680px;margin:22px auto;padding:14px}
.box{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 26px #17203312;border:1px solid #edf0f4}
h2{margin-top:0;font-size:22px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,textarea,select{width:100%;padding:14px;border:1px solid #d8dee8;border-radius:13px;font:inherit;background:#fff;transition:.2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:#6b9cff;box-shadow:0 0 0 4px #2563eb14}
textarea{min-height:90px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:13px;font:inherit;font-weight:bold;cursor:pointer;margin-top:10px;transition:transform .12s,box-shadow .12s}
button:active{transform:scale(.98)}
.save{background:linear-gradient(135deg,#16834a,#0f6d3c);color:white;box-shadow:0 5px 12px #138a4b25}
.return{background:#eef2f7;color:var(--text)}
#message{display:none;margin-top:15px;padding:12px;border-radius:12px;background:#dcfae6;color:#12652f;text-align:center}
#saved{margin-top:20px}
.client{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 4px 14px #1720330c}
.small{color:var(--muted);font-size:14px;margin-top:5px}

.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.card-actions button{padding:11px 7px;margin:0;border-radius:12px;font-family:inherit;cursor:pointer}
.add-btn{background:#e9f1ff;color:#175cd3}
.edit-btn{background:#fff4df;color:#b54708}
.delete-btn{background:#ffebe9;color:#b42318}
 
.search-btn,.all-btn{border:0;border-radius:12px;padding:12px 16px;font-family:inherit;cursor:pointer;margin-top:0}
.search-btn{background:linear-gradient(135deg,#16834a,#0f6d3c);color:#fff}.all-btn{background:#eef2f7;color:#172033}
.search-empty{text-align:center;color:var(--muted);padding:24px}

.client-name{display:block;color:#175cd3;cursor:pointer;text-decoration:none;font-size:20px;font-weight:800;margin-bottom:8px}
.client-name:hover{text-decoration:underline}
.detail-row{padding:12px 0;border-bottom:1px solid #eaecf0}
.detail-label{font-weight:bold;color:#475467;display:block;margin-bottom:4px}
.detail-value{color:#172033;word-break:break-word}

.list-page{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;overflow-y:auto}
.list-header{position:sticky;top:0;background:linear-gradient(135deg,#14213d,#1f3159);color:#fff;padding:15px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px #14213d25}
.list-header h2{margin:0;flex:1;text-align:center;font-size:21px}
.back-list{width:auto;background:#fff;color:#17213b;border:0;border-radius:11px;padding:9px 13px;font:inherit;cursor:pointer;margin:0}
.full-client-list{max-width:700px;margin:0 auto;padding:16px}
.full-client-list .client{display:block;width:100%;margin:0 0 12px;background:#fff;position:relative;overflow:hidden}
.full-client-list .client:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#2563eb}
.list-number{display:inline-flex;background:#e9f1ff;color:#175cd3;border-radius:10px;width:32px;height:32px;align-items:center;justify-content:center;margin-right:7px;font-weight:bold}
.list-phone{display:inline-block;margin-top:7px;background:#f2f7ff;color:#344054;border-radius:10px;padding:6px 9px;font-size:14px}
 
.reminder-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.reminder-stats>div{background:#f7f9fc;border-radius:12px;padding:12px;text-align:center}
.reminder-stats b{display:block;font-size:24px;margin-bottom:5px}
.reminder-stats span{font-size:13px}
.notify-btn{background:#176b3a;color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font:inherit;font-weight:bold;cursor:pointer;margin-bottom:8px}
.reminder-card{border-left:5px solid #f59e0b}
.reminder-card.overdue{border-left-color:#d92d20}
.reminder-card.upcoming{border-left-color:#12b76a}
.reminder-time{font-weight:bold;margin:7px 0}

.details-modal,.form-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;padding:18px;overflow:auto}
.details-modal.show,.form-modal.show{display:flex;align-items:flex-start;justify-content:center}
.modal-card{width:min(650px,100%);background:#fff;border-radius:18px;padding:20px;margin-top:30px;box-shadow:0 10px 35px #0003}
.modal-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eaecf0;padding-bottom:12px;margin-bottom:8px}
.modal-head h2{flex:1;text-align:center;margin:0}
.close-modal{width:auto;margin:0;background:#eef2f6;color:#172033;padding:8px 13px}
.details-actions{display:flex;gap:8px;margin-top:16px}.details-actions button{flex:1}
</style>
</head>
<body>
<header>
<h1>👤 New Customer Registration</h1>
</header>

<main>
<div class="box">
<h2>Customer Information</h2>

<label>Customer Name *</label>
<input id="name" placeholder="Example: Ahmed Ben Ali">

<label>Company Name</label>
<input id="company" placeholder="Example: Al Amal Company">

<label>Address</label>
<input id="address" placeholder="Customer address">

<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div>
<label>Country</label>
<input id="country" placeholder="Example: Tunisia">
</div>
<div>
<label>Region</label>
<input id="region" placeholder="Example: Greater Tunis">
</div>
</div>

<label>ZIP / Postal Code</label>
<input id="postalCode" inputmode="numeric" placeholder="Example: 1000">

<label>Phone Number</label>
<input id="phone" type="tel" placeholder="Example: 21 123 456">

<label>Email</label>
<input id="email" type="email" placeholder="Example: ahmed@example.com">

<label>📅 Follow-up Date</label>
<input id="followDate" type="date">

<label>📅 Appointment Date</label>
<input id="appointmentDate" type="date">

<label>⏰ Reminder Time</label>
<input id="followTime" type="time">

<label>📝 Follow-up Reason</label>
<input id="followReason" placeholder="Example: Call to confirm the order">

<label>Notes</label>
<textarea id="notes" placeholder="Enter any important information about the customer"></textarea>

<button class="save" onclick="saveClient()">💾 Save Customer</button>
<button class="return" onclick="goBack()">↩️ Back</button>

<div id="message">✅ Customer registration successful</div>
</div>

<div class="box" style="margin-top:18px">
<h2>🔎 Search for a Customer</h2>
<input id="clientSearch" placeholder="Search by customer name or phone number" oninput="searchClients()">
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
<button class="search-btn" onclick="searchClients()">🔎 Search</button>
<button class="all-btn" onclick="openClientListPage()">👥 Customer List</button>
</div>
</div>
<div id="saved"></div>
</main>


<div id="clientListPage" class="list-page">
  <div class="list-header">
    <button class="back-list" onclick="closeClientListPage()">↩️ Back</button>
    <h2>👥 Customer List</h2>
  </div>
  <div id="fullClientList" class="full-client-list"></div>
</div>

<div id="detailsModal" class="details-modal" onclick="if(event.target===this)closeDetails()">
  <div class="modal-card">
    <div class="modal-head">
      <button class="close-modal" onclick="closeDetails()">✕</button>
      <h2>👤 Customer Information</h2>
    </div>
    <div id="detailsContent"></div>
  </div>
</div>

<div id="modal" class="form-modal" onclick="if(event.target===this)document.getElementById('modal').classList.remove('show')">
  <div class="modal-card">
    <div class="modal-head">
      <button class="close-modal" onclick="document.getElementById('modal').classList.remove('show')">✕</button>
      <h2 id="formTitle">➕ Add Customer</h2>
    </div>
    <input type="hidden" id="editId">
    <label>Customer Name *</label><input id="m_name" placeholder="Example: Ahmed Ben Ali">
    <label>Company Name</label><input id="m_company" placeholder="Example: Al Amal Company">
    <label>Address</label><input id="m_address" placeholder="Customer address">
    <label>Country</label><input id="m_country" placeholder="Example: Tunisia">
    <label>Region</label><input id="m_region" placeholder="Example: Greater Tunis">
    <label>ZIP / Postal Code</label><input id="m_postalCode" placeholder="1000">
    <label>Phone Number</label><input id="m_phone" type="tel" placeholder="21 123 456">
    <label>Email</label><input id="m_email" type="email" placeholder="ahmed@example.com">
    <label>📅 Follow-up Date</label><input id="m_followDate" type="date">
    <label>📅 Appointment Date</label><input id="m_appointmentDate" type="date">
    <label>⏰ Reminder Time</label><input id="m_followTime" type="time">
    <label>📝 Follow-up Reason</label><input id="m_followReason" placeholder="Reason for contact">
    <label>Notes</label><textarea id="m_notes" placeholder="Customer notes"></textarea>
    <button class="save" onclick="saveFromModal()">💾 Save</button>
  </div>
</div>

<script>
const KEY="clients_step_one_ar";
let clients=JSON.parse(localStorage.getItem(KEY)||"[]");

function saveClient(){
 const name=document.getElementById("name").value.trim();
 if(!name){alert("Please enter the customer name");return}

 const editId=document.getElementById("editId") ? document.getElementById("editId").value : "";
 const data={
  name:name,
  company:document.getElementById("company").value.trim(),
  address:document.getElementById("address").value.trim(),
  country:document.getElementById("country").value.trim(),
  region:document.getElementById("region").value.trim(),
  postalCode:document.getElementById("postalCode").value.trim(),
  followDate:document.getElementById("followDate").value,
  followTime:document.getElementById("followTime").value,
  followReason:document.getElementById("followReason").value.trim(),
  phone:document.getElementById("phone").value.trim(),
  email:document.getElementById("email").value.trim(),
  notes:document.getElementById("notes").value.trim()
 };

 if(editId){
   const index=clients.findIndex(c=>c.id===editId);
   if(index>=0){
     data.id=editId;
     data.createdAt=clients[index].createdAt;
     data.reminderDone=false;
     clients[index]=data;
   }
 }else{
   data.id=Date.now().toString();
   data.createdAt=new Date().toISOString();
   data.reminderDone=false;
   clients.unshift(data);
 }

 localStorage.setItem(KEY,JSON.stringify(clients));
 document.getElementById("message").style.display="block";
 document.getElementById("message").textContent="✅ Customer information saved successfully";
 ["name","company","address","country","region","postalCode","followDate","appointmentDate","followTime","followReason","phone","email","notes"].forEach(id=>document.getElementById(id).value="");
 if(document.getElementById("editId")) document.getElementById("editId").value="";
 updateReminderDashboard();
 showAllClients();
}

function showSaved(items=clients,title="Registered customers"){
 const box=document.getElementById("saved");
 if(!items.length){
   box.innerHTML=`<div class="box search-empty">No results found</div>`;
   return;
 }
 box.innerHTML=`<div class="box"><h3>${title}</h3>`+items.map(c=>
 `<div class="client" data-id="${c.id}" onclick="openDetailsFromCard(event, '${c.id}')">
 <b class="client-name">${escapeHtml(c.name)}</b>
 ${c.company?`<div class="small">🏢 ${escapeHtml(c.company)}</div>`:""}
 ${c.address?`<div class="small">📍 ${escapeHtml(c.address)}</div>`:""}
 ${(c.country||c.region||c.postalCode)?`<div class="small">🌍 ${escapeHtml([c.country,c.region,c.postalCode].filter(Boolean).join(" - "))}</div>`:""}
 ${c.phone?`<div class="small">📞 ${escapeHtml(c.phone)}</div>`:""}
 <div class="card-actions">
   <button class="add-btn" onclick="event.stopPropagation();newClient()">➕ Add</button>
   <button class="edit-btn" onclick="event.stopPropagation();editClient('${c.id}')">✏️ Edit</button>
   <button class="delete-btn" onclick="event.stopPropagation();deleteClient('${c.id}')">🗑️ Delete</button>
 </div>
 </div>`).join("")+"</div>";
}

function searchClients(){
 const q=document.getElementById("clientSearch").value.trim().toLowerCase();
 if(!q){showAllClients();return}
 const results=clients.filter(c=>{
   const name=String(c.name||"").toLowerCase();
   const phone=String(c.phone||"").replace(/\s+/g,"").toLowerCase();
   const queryPhone=q.replace(/\s+/g,"");
   return name.includes(q)||phone.includes(queryPhone);
 });
 showSaved(results,`Search results (${results.length})`);
}



function reminderDateTime(c){
 if(!c.followDate)return null;
 const t=c.followTime||"09:00";
 const d=new Date(c.followDate+"T"+t+":00");
 return isNaN(d.getTime())?null:d;
}

function reminderStatus(c){
 const d=reminderDateTime(c);
 if(!d || c.reminderDone)return "none";
 const now=new Date();
 const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const tomorrow=new Date(start); tomorrow.setDate(tomorrow.getDate()+1);
 if(d<start)return "overdue";
 if(d<tomorrow)return "today";
 return "upcoming";
}

function updateReminderDashboard(){
  // Dashboard status cards removed from the interface.
}

function showReminders(){
 const page=document.getElementById("clientListPage");
 const box=document.getElementById("fullClientList");
 const active=clients.filter(c=>!c.reminderDone && reminderDateTime(c))
   .sort((a,b)=>reminderDateTime(a)-reminderDateTime(b));
 document.querySelector("#clientListPage .list-header h2").textContent="🔔 Reminder List";
 if(!active.length){
   box.innerHTML='<div class="client" style="text-align:center">No reminders at the moment</div>';
 }else{
   box.innerHTML=active.map(c=>{
     const s=reminderStatus(c);
     const label=s==="overdue"?"🔴 Overdue":s==="today"?"🟠 Today":"🟢 Upcoming";
     return `<div class="client reminder-card ${s}">
       <div><b class="client-name" onclick="event.stopPropagation();showClientDetails('${c.id}')">${escapeHtml(c.name)}</b></div>
       <div class="reminder-time">${label} — 📅 ${escapeHtml(c.followDate)} ⏰ ${escapeHtml(c.followTime||"09:00")}</div>
       ${c.followReason?`<div class="small">🎯 ${escapeHtml(c.followReason)}</div>`:""}
       ${c.phone?`<div class="small">📞 ${escapeHtml(c.phone)}</div>`:""}
       <div class="card-actions">
        <button class="add-btn" onclick="event.stopPropagation();completeReminder('${c.id}')">✅ Contacted</button>
        <button class="edit-btn" onclick="event.stopPropagation();snoozeReminder('${c.id}')">⏰ Snooze</button>
       </div>
     </div>`;
   }).join("");
 }
 page.style.display="block"; document.body.style.overflow="hidden";
}

function completeReminder(id){
 const c=clients.find(x=>x.id===id); if(!c)return;
 c.reminderDone=true;
 localStorage.setItem(KEY,JSON.stringify(clients));
 updateReminderDashboard(); showReminders();
}

function snoozeReminder(id){
 const c=clients.find(x=>x.id===id); if(!c)return;
 const d=reminderDateTime(c)||new Date();
 d.setDate(d.getDate()+1);
 c.followDate=d.toISOString().slice(0,10);
 c.followTime=d.toTimeString().slice(0,5);
 c.reminderDone=false;
 localStorage.setItem(KEY,JSON.stringify(clients));
 updateReminderDashboard(); showReminders();
}

async function enableNotifications(){
 if(!("Notification" in window)){
   alert("This browser does not support phone notifications.");
   return;
 }
 const permission=await Notification.requestPermission();
 if(permission==="granted"){
   alert("✅ Notifications enabled. Keep the program open to receive the reminder on time.");
   checkReminders(true);
 }else{
   alert("Notifications were not allowed.");
 }
}

let lastReminderKey="";
function checkReminders(force=false){
 const now=new Date();
 clients.forEach(c=>{
   if(c.reminderDone)return;
   const d=reminderDateTime(c);
   if(!d)return;
   const diff=Math.abs(now-d);
   const key=c.id+"-"+c.followDate+"-"+(c.followTime||"09:00");
   if((d<=now && now-d<65000) && (force || key!==lastReminderKey)){
     lastReminderKey=key;
     sendReminder(c);
   }
 });
 updateReminderDashboard();
}

function sendReminder(c){
 prepareReminderAudio();
 playCalmReminderMusic();
 const title="🔔 It is time to follow up with the customer";
 const body=`${c.name}${c.followReason?" — "+c.followReason:""}${c.phone?" — 📞 "+c.phone:""}`;
 if("Notification" in window && Notification.permission==="granted"){
   new Notification(title,{body});
 }

 // Give the music a moment to start before showing the reminder dialog.
 setTimeout(() => {
   alert("🔔 It is time to follow up with the customer: "+c.name);
 }, 350);
}

setInterval(checkReminders,30000);

function openClientListPage(){
 const page=document.getElementById("clientListPage");
 const box=document.getElementById("fullClientList");
 if(!clients.length){
   box.innerHTML='<div class="client" style="text-align:center;padding:35px">👥<br><b>No customers registered</b><div class="small">Add your first customer to see them here.</div></div>';
 }else{
   box.innerHTML=clients.map((c,i)=>`
   <div class="client" onclick="showClientDetails('${c.id}')">
     <div style="display:flex;align-items:center;gap:8px">
       <span class="list-number">${i+1}</span>
       <b class="client-name" style="margin:0">${escapeHtml(c.name)}</b>
     </div>
     ${c.company?`<div class="small">🏢 ${escapeHtml(c.company)}</div>`:""}
     ${c.phone?`<span class="list-phone">📞 ${escapeHtml(c.phone)}</span>`:""}
   </div>`).join("");
 }
 page.style.display="block";
 document.body.style.overflow="hidden";
}

function closeClientListPage(){
 document.getElementById("clientListPage").style.display="none";
 document.body.style.overflow="";
}

function showAllClients(){
 document.getElementById("clientSearch").value="";
 showSaved(clients,"Customer List");
}


function openDetailsFromCard(event,id){
 if(event.target.closest("button")) return;
 showClientDetails(id);
}
function showClientDetails(id){
 const c=clients.find(x=>x.id===id);
 if(!c)return;
 document.getElementById("detailsContent").innerHTML=
 `<div class="detail-row"><span class="detail-label">👤 Customer Name</span><div class="detail-value">${escapeHtml(c.name||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">🏢 Company</span><div class="detail-value">${escapeHtml(c.company||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">📍 Address</span><div class="detail-value">${escapeHtml(c.address||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">🌍 Country</span><div class="detail-value">${escapeHtml(c.country||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">🗺️ Region</span><div class="detail-value">${escapeHtml(c.region||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">📮 ZIP / Postal Code</span><div class="detail-value">${escapeHtml(c.postalCode||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">📞 Phone Number</span><div class="detail-value">${escapeHtml(c.phone||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">✉️ Email</span><div class="detail-value">${escapeHtml(c.email||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">📅 Follow-up Date</span><div class="detail-value">${escapeHtml(c.followDate||"—")}</div></div>
  <div class="detail-row"><span class="detail-label">📅 Appointment Date</span><div class="detail-value">${escapeHtml(c.appointmentDate||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">⏰ Reminder Time</span><div class="detail-value">${escapeHtml(c.followTime||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">🎯 Follow-up Reason</span><div class="detail-value">${escapeHtml(c.followReason||"—")}</div></div>
 <div class="detail-row"><span class="detail-label">📝 Notes</span><div class="detail-value">${escapeHtml(c.notes||"—")}</div></div>
 <div class="card-actions">
 <button class="edit-btn" onclick="closeDetails();editClient('${c.id}')">✏️ Edit</button>
 <button class="delete-btn" onclick="closeDetails();deleteClient('${c.id}')">🗑️ Delete</button>
 </div>`;
 document.getElementById("detailsModal").classList.add("show");
}
function closeDetails(){document.getElementById("detailsModal").classList.remove("show")}

function newClient(){
 document.getElementById("editId").value="";
 document.getElementById("formTitle").textContent="➕ Add Customer";
 ["name","company","address","country","region","postalCode","phone","email","followDate","appointmentDate","followTime","followReason","notes"].forEach(k=>document.getElementById("m_"+k).value="");
 document.getElementById("modal").classList.add("show");
}

function editClient(id){
 const c=clients.find(x=>x.id===id); if(!c)return;
 document.getElementById("editId").value=c.id;
 document.getElementById("formTitle").textContent="✏️ Edit Customer";
 ["name","company","address","country","region","postalCode","phone","email","followDate","appointmentDate","followTime","followReason","notes"].forEach(k=>document.getElementById("m_"+k).value=c[k]||"");
 document.getElementById("modal").classList.add("show");
}

function saveFromModal(){
 const id=document.getElementById("editId").value;
 const name=document.getElementById("m_name").value.trim();
 if(!name){alert("Please enter the customer name");return}
 const data={
  name, company:document.getElementById("m_company").value.trim(), address:document.getElementById("m_address").value.trim(),
  country:document.getElementById("m_country").value.trim(), region:document.getElementById("m_region").value.trim(), postalCode:document.getElementById("m_postalCode").value.trim(),
  phone:document.getElementById("m_phone").value.trim(), email:document.getElementById("m_email").value.trim(), followDate:document.getElementById("m_followDate").value, appointmentDate:document.getElementById("m_appointmentDate").value,
  followTime:document.getElementById("m_followTime").value, followReason:document.getElementById("m_followReason").value.trim(), notes:document.getElementById("m_notes").value.trim()
 };
 if(id){ const i=clients.findIndex(c=>c.id===id); if(i>=0){data.id=id;data.createdAt=clients[i].createdAt;data.reminderDone=clients[i].reminderDone||false;clients[i]=data;} }
 else {data.id=Date.now().toString();data.createdAt=new Date().toISOString();data.reminderDone=false;clients.unshift(data);}
 localStorage.setItem(KEY,JSON.stringify(clients));
 document.getElementById("modal").classList.remove("show");
 showAllClients(); updateReminderDashboard();
 alert("✅ Customer information saved");
}

function deleteClient(id){
 if(!confirm("Do you want to delete this customer?"))return;
 clients=clients.filter(c=>c.id!==id);
 localStorage.setItem(KEY,JSON.stringify(clients));
 showSaved();
}

function goBack(){

function playCalmReminderMusic(){

    compressor.knee.setValueAtTime(18, ctx.currentTime);

    compressor.attack.setValueAtTime(0.005, ctx.currentTime);

    ];

    const start = ctx.currentTime + 0.08;

    function note(freq, offset, duration, volume, type){
      const now = start + offset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.035);
      gain.gain.exponentialRampToValueAtTime(volume * 0.55, now + duration * 0.55);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      osc.start(now);
      osc.stop(now + duration + 0.03);
    }
